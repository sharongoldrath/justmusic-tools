<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Just Music Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Assistant:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;--panel:#141414;--line:#4a4a4a;--text:#fff;
  --muted:#c8c8c8;--yellow:#f4ff00;--blue:#3d7eff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{
  font-family:'Assistant','Cairo',sans-serif;
  display:grid;place-items:center;
  background:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px),
    #080808;
  background-size:42px 42px;
}
.shell{
  width:min(560px,92vw);
  border:2px solid #fff;
  background:#0d0d0d;
  box-shadow:14px 14px 0 rgba(255,255,255,.08);
  padding:34px;
  position:relative;
  overflow:hidden;
}
.shell::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(125deg,transparent 0 72%,rgba(244,255,0,.08) 72% 75%,transparent 75%);
}
.kicker{
  font:700 11px monospace;letter-spacing:.2em;color:var(--yellow);
  margin-bottom:12px;position:relative;
}
h1{margin:0;font-size:clamp(42px,9vw,78px);line-height:.95;letter-spacing:-.04em;position:relative}
.sub{color:var(--muted);font-weight:700;margin:14px 0 26px;position:relative}
label{display:block;font-weight:800;margin-bottom:8px;position:relative}
input{
  width:100%;padding:15px 16px;background:#050505;color:#fff;
  border:1px solid #666;font-size:18px;outline:none;position:relative;
}
input:focus{border-color:var(--yellow);box-shadow:0 0 0 3px rgba(244,255,0,.12)}
button{
  border:0;cursor:pointer;font:800 15px inherit;transition:.16s;
}
#loginBtn{
  width:100%;margin-top:14px;padding:15px;background:var(--yellow);color:#080808;
}
#loginBtn:hover{transform:translateY(-2px);box-shadow:6px 6px 0 rgba(244,255,0,.2)}
#error{display:none;color:#ff5479;font-weight:800;margin-top:12px}
#languageStep{display:none}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.lang{
  min-height:130px;background:#181818;color:#fff;border:1px solid #555;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
}
.lang:hover{transform:translateY(-5px);border-color:var(--blue);box-shadow:7px 7px 0 rgba(61,126,255,.22)}
.lang .code{font:900 34px monospace}
.lang .name{font-size:20px;font-weight:900}
.note{margin-top:18px;color:#aaa;font-size:12px;text-align:center}
@media(max-width:520px){.lang-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="shell">
  <section id="loginStep">
    <div class="kicker">JUST MUSIC · INTERACTIVE LEARNING TOOLS</div>
    <h1>JUST<br>MUSIC</h1>
    <p class="sub">כניסה לכלי הלימוד האינטראקטיביים</p>
    <label for="password">סיסמה</label>
    <input id="password" type="password" autocomplete="current-password" placeholder="הקלד סיסמה">
    <button id="loginBtn">כניסה</button>
    <div id="error">הסיסמה אינה נכונה</div>
  </section>

  <section id="languageStep">
    <div class="kicker">SELECT LANGUAGE · اختر اللغة</div>
    <h1 style="font-size:clamp(34px,7vw,60px)">בחרו שפה</h1>
    <p class="sub">בחרו את שפת כלי הלימוד</p>
    <div class="lang-grid">
      <button class="lang" data-lang="he">
        <span class="code">HE</span>
        <span class="name">עברית</span>
      </button>
      <button class="lang" data-lang="ar">
        <span class="code">AR</span>
        <span class="name">العربية</span>
      </button>
    </div>
    <div class="note">הבחירה נשמרת רק ללשונית הנוכחית</div>
  </section>
</main>

function decodeBase64Utf8(value) {
  const binary = atob(value);
  const bytes = Uint8Array.from(binary, ch => ch.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function showLanguages() {
  document.getElementById('loginStep').style.display = 'none';
  document.getElementById('languageStep').style.display = 'block';
}

function login() {
  const field = document.getElementById('password');
  if (field.value === PASSWORD) {
    sessionStorage.setItem('jm_authenticated', '1');
    document.getElementById('error').style.display = 'none';
    showLanguages();
  } else {
    document.getElementById('error').style.display = 'block';
    field.select();
  }
}

function openLanguage(lang) {
  const source = DOCUMENTS[lang];
  if (!source) return;
  sessionStorage.setItem('jm_language', lang);
  const content = decodeBase64Utf8(source);
  document.open();
  document.write(content);
  document.close();
}

document.getElementById('loginBtn').addEventListener('click', login);
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});
document.querySelectorAll('[data-lang]').forEach(button => {
  button.addEventListener('click', () => openLanguage(button.dataset.lang));
});

if (sessionStorage.getItem('jm_authenticated') === '1') {
  showLanguages();
}
</script>
</body>
</html>
