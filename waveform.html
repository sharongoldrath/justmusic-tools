<head>

<style>

html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
body{font-family:'Assistant',sans-serif;background:

radial-gradient(800px 460px at 100% 0%,rgba(244,255,0,.06),transparent 60%),
linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),

.app{max-width:1420px;margin:auto;padding:22px 22px 46px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}

.layout{display:grid;grid-template-columns:285px minmax(0,1fr);gap:18px;align-items:start}
.sidebar,.workspace{background:rgba(17,17,17,.97);border:1px solid var(--line);box-shadow:0 22px 60px rgba(0,0,0,.38)}
.sidebar{position:sticky;top:18px;padding:16px}.side-title{font:700 11px 'IBM Plex Mono';color:#8f969f;letter-spacing:.14em;margin:4px 4px 14px}

.step:hover{background:#181818;border-color:#303030}.step.active{background:#1b1b1b;border-color:#5b5b5b;box-shadow:inset 3px 0 0 var(--jm)}
.step-num{width:34px;height:34px;border:1px solid #4b4b4b;border-radius:8px;display:grid;place-items:center;font:700 12px 'IBM Plex Mono';color:#aeb4be}.step.active .step-num{color:#080808;background:var(--jm);border-color:var(--jm)}
.step b{display:block;font-size:15px}.step small{display:block;color:#959ca6;margin-top:2px;font-size:12px}
.progress-wrap{margin-top:18px;border-top:1px solid #2d2d2d;padding-top:16px}.progress-head{display:flex;justify-content:space-between;color:#9ca3ad;font:600 11px 'IBM Plex Mono';margin-bottom:8px}.progress{height:6px;background:#282828;border-radius:10px;overflow:hidden}.progress>i{display:block;height:100%;width:33%;background:var(--jm);transition:.35s}
.workspace{min-height:760px;overflow:hidden}.stage-head{padding:22px 24px 16px;border-bottom:1px solid #2d2d2d;display:flex;justify-content:space-between;gap:18px;align-items:flex-start}
.stage-kicker{font:700 10px 'IBM Plex Mono';letter-spacing:.14em;color:var(--blue)}.stage-title{font:900 clamp(24px,3vw,38px) 'Rubik';margin:4px 0 6px;letter-spacing:-.03em}.stage-copy{color:#b9bec6;font-size:16px;max-width:830px;margin:0;line-height:1.55}.badge{border:1px solid #454545;background:#181818;border-radius:999px;padding:8px 12px;font:700 10px 'IBM Plex Mono';white-space:nowrap;color:#c8cdd4}
.visual-zone{padding:18px 24px 8px}.transport{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.transport button,.action-btn,.frequency-btn{border:1px solid #4b4b4b;background:linear-gradient(#252525,#171717);border-radius:8px;cursor:pointer;transition:.15s}.transport button:hover,.action-btn:hover,.frequency-btn:hover{transform:translateY(-1px);border-color:#767676}
.play{width:48px;height:42px;font-size:18px}.reset{padding:10px 14px;font-weight:800}.time{font:600 12px 'IBM Plex Mono';color:#b9c0c8;background:#080808;border:1px solid #323232;border-radius:8px;padding:10px 13px;min-width:138px;text-align:center}
.status{margin-inline-start:auto;display:flex;gap:8px;align-items:center;font:600 10px 'IBM Plex Mono';color:#7f8790}.status i{width:7px;height:7px;border-radius:50%;background:#2ecc71;box-shadow:0 0 10px rgba(46,204,113,.7)}
.deck-shell{background:#050505;border:1px solid #3b3b3b;border-radius:12px;overflow:hidden;box-shadow:inset 0 0 35px rgba(0,0,0,.8),0 10px 30px rgba(0,0,0,.22)}
.deck-top{height:42px;display:flex;align-items:center;gap:14px;padding:0 14px;background:linear-gradient(#151515,#0d0d0d);border-bottom:1px solid #272727;font:600 11px 'IBM Plex Mono';color:#a8aeb7}.deck-top .track{color:#fff;font-family:'Assistant';font-weight:800}.deck-top .spacer{flex:1}.deck-top .metric b{color:#fff}
.overview-wrap{position:relative;height:72px;border-bottom:1px solid #303030;background:#070707}.detail-wrap{position:relative;height:285px;background:#040505}
canvas{width:100%;height:100%;display:block}.playhead{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#ff3b30;box-shadow:0 0 12px rgba(255,59,48,.8);z-index:6;pointer-events:none}.playhead:before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:9px solid #ff3b30}

.info-row{display:grid;grid-template-columns:1.06fr .94fr;gap:16px;padding:16px 24px 24px}.card{background:#151515;border:1px solid #343434;border-radius:12px;padding:16px}.card h3{font:800 17px 'Rubik';margin:0 0 8px}.card p{color:#b8bec7;margin:0;line-height:1.55}.insight{border-right:3px solid var(--jm)}

.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.action-btn{padding:11px 14px;font-weight:800}.action-btn.active{background:var(--jm);color:#080808;border-color:var(--jm)}
.callout{display:grid;grid-template-columns:36px 1fr;gap:11px;align-items:start;padding:12px 13px;background:#0e0e0e;border:1px solid #2e2e2e;border-radius:10px;margin-top:12px}.callout .icon{width:36px;height:36px;border-radius:8px;border:1px solid #444;display:grid;place-items:center;font:700 12px 'IBM Plex Mono';color:var(--jm)}.callout b{display:block;margin-bottom:2px}.callout small{color:#aab0b8;line-height:1.45}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;color:#aeb4be;font-size:13px}.legend span{display:flex;align-items:center;gap:6px}.dot{width:9px;height:9px;border-radius:50%}
.footer-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-top:1px solid #2d2d2d;background:#101010}.nav-btn{border:1px solid #4b4b4b;background:#1a1a1a;padding:11px 17px;border-radius:9px;font-weight:800;cursor:pointer}.nav-btn.primary{background:var(--jm);border-color:var(--jm);color:#080808}.nav-btn:disabled{opacity:.35;cursor:not-allowed}.stage-counter{font:600 11px 'IBM Plex Mono';color:#888f98}

/* Visual language aligned with the Transition Simulator — layout/logic unchanged */
:root{
  --bg:#080808;
  --panel:#131313;
  --panel2:#1d1d1d;
  --line:#3a3a3a;
  --line2:#555;
  --text:#fff;
  --muted:#c6c6c6;
  --jm:#f4ff00;
  --blue:#3d7eff;
  --cyan:#3d7eff;
  --amber:#ff7a21;
  --alert:#ff2f73;
}
body{
  background:
    radial-gradient(900px 500px at 12% -8%,rgba(61,126,255,.10),transparent 60%),
    radial-gradient(900px 500px at 100% 0%,rgba(255,122,33,.08),transparent 55%),
    #080808;
}
.app{max-width:980px;padding:32px 18px 80px}
.topbar{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:2px solid var(--line);border-radius:20px;
  padding:26px 28px 24px;margin-bottom:32px;
}
.topbar:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.03) 0 2px,transparent 2px 7px)
}
.brand,.header-note{position:relative;z-index:1}
.logo{border-radius:10px;border:2px solid var(--line2);background:#111;box-shadow:0 8px 18px rgba(0,0,0,.28)}
.kicker{color:var(--cyan)}
h1{background:linear-gradient(90deg,#fff,var(--cyan) 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-note{color:var(--muted)}
.layout{grid-template-columns:250px minmax(0,1fr);gap:20px}
.sidebar,.workspace{background:var(--panel);border:2px solid var(--line);border-radius:16px;box-shadow:none}
.sidebar{padding:18px}
.step{border-radius:10px;border:2px solid transparent}
.step:hover{background:var(--panel2);border-color:var(--line)}
.step.active{background:var(--panel2);border-color:var(--cyan);box-shadow:0 0 14px rgba(61,126,255,.14)}
.step-num{border:2px solid var(--line);border-radius:7px}
.step.active .step-num{background:var(--cyan);border-color:var(--cyan);color:#08101c}

.stage-head{padding:24px 24px 18px;border-bottom:0}
.stage-kicker{color:var(--cyan)}
.badge{border:2px solid var(--line);background:var(--panel2);border-radius:9px}
.footer-nav{
  margin:0 24px 4px;padding:12px 0 14px;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:transparent;
}
.nav-btn,.transport button,.action-btn,.frequency-btn{
  font-family:'IBM Plex Mono',monospace;
  border:2px solid var(--line);
  background:linear-gradient(180deg,#202936,#171e28);
  box-shadow:0 7px 16px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.045);
}
.nav-btn{border-radius:9px;padding:10px 16px;transition:.15s}
.nav-btn:hover:not(:disabled){transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 10px 22px rgba(0,0,0,.28),0 0 14px rgba(61,126,255,.16)}

.nav-btn.primary{background:linear-gradient(180deg,#4c89ff,#2f69e8);border-color:var(--cyan);color:#fff;box-shadow:0 0 14px rgba(61,126,255,.28),inset 0 1px 0 rgba(255,255,255,.16)}
.visual-zone{padding-top:16px}

.card.insight{border-right:2px solid var(--line);box-shadow:inset -4px 0 0 var(--cyan)}

.callout .icon{border:2px solid var(--line);color:var(--cyan)}

@media(max-width:930px){.app{max-width:980px}.layout{grid-template-columns:1fr}.topbar{margin-bottom:20px}}

<body>
<div class="app">
<header class="topbar"><div class="brand"><div class="logo">JM</div><div><div class="kicker">JUST MUSIC · INTERACTIVE LEARNING TOOLS</div><h1>INSIDE THE WAVEFORM</h1></div></div><div class="header-note">לומדה אינטראקטיבית להבנת ה־Waveform, שלושת תחומי התדרים והקשר ל־Grid.</div></header>
<div class="layout">
<aside class="sidebar">
<div class="side-title">LEARNING FLOW</div>
<div class="steps">
<button class="step active" data-step="0"><span class="step-num">01</span><span><b>מהו Waveform?</b><small>הצורה של האודיו לאורך זמן</small></span></button>
<button class="step" data-step="1"><span class="step-num">02</span><span><b>צבעים ותדרים</b><small>Low · Mid · High</small></span></button>
<button class="step" data-step="2"><span class="step-num">03</span><span><b>Waveform + Grid</b><small>המוזיקה והסרגל</small></span></button>
</div>
<div class="progress-wrap"><div class="progress-head"><span>PROGRESS</span><span id="progressText">33%</span></div><div class="progress"><i id="progressBar"></i></div></div>
</aside>
<main class="workspace">
<section class="stage-head"><div><div class="stage-kicker" id="stageKicker"></div><h2 class="stage-title" id="stageTitle"></h2><p class="stage-copy" id="stageCopy"></p></div><div class="badge" id="stageBadge"></div></section>
<footer class="footer-nav"><button class="nav-btn" id="prevBtn">הקודם</button><div class="stage-counter" id="stageCounter">STEP 01 / 03</div><button class="nav-btn primary" id="nextBtn">הבא</button></footer>
<section class="visual-zone">
<div class="transport"><button class="play" id="playBtn" aria-label="נגן">▶</button><button class="reset" id="resetBtn">איפוס</button><div class="time" id="timeReadout">00:00.0 / 00:16.0</div><div class="status"><i></i> LIVE VISUALIZER</div></div>
<div class="deck-shell">
<div class="deck-top"><span class="track">JUST MUSIC — WAVEFORM DEMO</span><span class="spacer"></span><span class="metric">KEY <b>4A</b></span><span class="metric">BPM <b>120.00</b></span></div>
<div class="overview-wrap"><canvas id="overviewCanvas"></canvas><div class="wave-label">OVERVIEW WAVEFORM</div><div class="overview-cursor" id="overviewCursor"></div><div class="zoom-window" id="zoomWindow"></div></div>
<div class="detail-wrap"><canvas id="detailCanvas"></canvas><div class="playhead"></div><div class="detail-grid-label">DETAILED WAVEFORM</div></div>
</div>
</section>
<section class="info-row" id="infoRow"></section>
</main>
</div>
</div>
<script>
const overview=document.getElementById('overviewCanvas'),detail=document.getElementById('detailCanvas');
const octx=overview.getContext('2d'),dctx=detail.getContext('2d');
const playBtn=document.getElementById('playBtn'),resetBtn=document.getElementById('resetBtn'),timeReadout=document.getElementById('timeReadout');
const infoRow=document.getElementById('infoRow'),stageKicker=document.getElementById('stageKicker'),stageTitle=document.getElementById('stageTitle'),stageCopy=document.getElementById('stageCopy'),stageBadge=document.getElementById('stageBadge');
const prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),stageCounter=document.getElementById('stageCounter'),progressText=document.getElementById('progressText'),progressBar=document.getElementById('progressBar');
const overviewCursor=document.getElementById('overviewCursor'),zoomWindow=document.getElementById('zoomWindow');
const steps=[...document.querySelectorAll('.step')];
const DURATION=16,BPM=120,beatDur=60/BPM,visible=8,MODEL_SR=12000;
let currentStep=0,playing=false,startAt=0,pausedAt=0,raf=0,audioCtx=null,source=null,activeBand='all',showGrid=false,gridAnimStart=0;
const stages=[
{k:'01 · WAVEFORM BASICS',t:'מה אנחנו בעצם רואים?',b:'AUDIO → SHAPE',c:'ה־Waveform הוא ייצוג חזותי של קטע האודיו עצמו. משמאל לימין מתקדם הזמן, וגובה הגל בכל נקודה נקבע לפי עוצמת האודיו שנשמעת באותו רגע.'},
{k:'02 · FREQUENCY COLORS',t:'מאיפה מגיעים הצבעים?',b:'LOW · MID · HIGH',c:'הקטע מורכב משלושה תחומי תדרים שפועלים יחד. כל צבע מציג רכיב אחר בתוך אותו האודיו — וכאשר מחברים את שלושתם מתקבל ה־Waveform המלא.'},
{k:'03 · GRID CONNECTION',t:'איך ה־Grid מתחבר ל־Waveform?',b:'AUDIO + MUSICAL GRID',c:'ה־Waveform הוא האודיו. ה־Grid הוא שכבת זמן מוזיקלית שהתוכנה מניחה מעליו כדי לסמן את הביטים ואת תחילת התיבות.'}
];

/* אותו מידע משמש גם ליצירת האודיו וגם לציור ה־Waveform. */
const N=Math.floor(DURATION*MODEL_SR);
const bands={low:new Float32Array(N),mid:new Float32Array(N),high:new Float32Array(N),all:new Float32Array(N)};
let seed=73621;
function rnd(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296*2-1}
function sectionGain(t){
 if(t<4)return .46;
 if(t<8)return .20;
 if(t<12)return .34+(t-8)*.10;
 return .78;
}
function pulse(phase,sharpness){return Math.exp(-phase*sharpness)}
for(let i=0;i<N;i++){
 const t=i/MODEL_SR,section=sectionGain(t),beatPhase=(t%beatDur)/beatDur,eighth=(t%(beatDur/2))/(beatDur/2);
 /* שכבת LOW מודגשת וברורה יותר: Kick עמוק בכל ביט + Sub Bass שפועם
    בדיוק לפי אותו beatDur שעליו מצויר ה־Grid. */
 const kickEnv=pulse(beatPhase,12);
 const kickPitch=46+48*Math.exp(-beatPhase*20);
 const kick=Math.sin(2*Math.PI*kickPitch*t)*kickEnv;
 const subPulse=.20+.80*Math.exp(-beatPhase*3.2);
 const sub=Math.sin(2*Math.PI*46*t)*subPulse;
 const bassNote=Math.sin(2*Math.PI*58*t)*(.22+.34*Math.sin(Math.PI*Math.min(1,beatPhase)));
 bands.low[i]=(kick*1.02+sub*.68+bassNote*.34)*section;

 const snarePhase=((t+beatDur)% (beatDur*2))/(beatDur*2);
 const snareEnv=Math.exp(-Math.abs(snarePhase-beatDur/(beatDur*2))*34);
 const chord=(Math.sin(2*Math.PI*220*t)+.55*Math.sin(2*Math.PI*330*t)+.32*Math.sin(2*Math.PI*440*t))/1.87;
 const midPulse=.18+.46*snareEnv+.09*Math.sin(t*2.3)**2;
 bands.mid[i]=chord*midPulse*section*.86;

 const hatEnv=pulse(eighth,28);
 const noise=(rnd()*.72+rnd()*.28);
 bands.high[i]=noise*hatEnv*(t<8?.18:.28)*section;

 bands.all[i]=Math.tanh((bands.low[i]+bands.mid[i]+bands.high[i])*.82);
}
for(const key of ['low','mid','high','all']){
 const a=bands[key], tmp=new Float32Array(a.length);
 for(let i=1;i<a.length-1;i++){
   tmp[i]=(a[i-1]*0.2+a[i]*0.6+a[i+1]*0.2);
 }
 tmp[0]=a[0]; tmp[a.length-1]=a[a.length-1];
 bands[key]=tmp;
}

function resizeCanvas(c,ctx){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
function resize(){resizeCanvas(overview,octx);resizeCanvas(detail,dctx);draw()}
window.addEventListener('resize',resize);
function bandColor(b,a=1){return b==='low'?`rgba(255,59,48,${a})`:b==='mid'?`rgba(56,212,123,${a})`:`rgba(40,184,255,${a})`}
function sampleRms(arr,t0,t1){
 let a=Math.max(0,Math.floor(t0*MODEL_SR)),b=Math.min(N,Math.ceil(t1*MODEL_SR));
 if(b<=a)return 0;
 const stride=Math.max(1,Math.floor((b-a)/28));let sum=0,count=0,peak=0;
 for(let i=a;i<b;i+=stride){const v=arr[i];sum+=v*v;peak=Math.max(peak,Math.abs(v));count++}
 return Math.min(1,Math.sqrt(sum/Math.max(1,count))*.92+peak*.32);
}
function ampsForWindow(t0,t1){return{
 low:sampleRms(bands.low,t0,t1),mid:sampleRms(bands.mid,t0,t1),high:sampleRms(bands.high,t0,t1),all:sampleRms(bands.all,t0,t1)
}}
function line(ctx,x,y1,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x,y1);ctx.lineTo(x,y2);ctx.stroke()}
function drawWave(ctx,w,h,timeAtX){
 const c=h/2;
 for(let x=0;x<w;x++){
  const t0=timeAtX(x,w),t1=timeAtX(x+1,w);if(t1<0||t0>DURATION)continue;
  const a=ampsForWindow(t0,t1);
  if(currentStep===0){
   const H=Math.max(.6,a.all*h*.45);line(ctx,x,c-H,c+H,'rgba(214,220,228,.92)');
  }else if(activeBand!=='all'){
   const H=Math.max(.45,a[activeBand]*h*.45);line(ctx,x,c-H,c+H,bandColor(activeBand,.98));
  }else{
   /* שלושת התחומים מוצגים כרכיבים נפרדים של אותו גל, לא כצביעה אחידה. */
   const total=Math.max(.001,a.low+a.mid+a.high),target=Math.max(1,a.all*h*.45);
   const l=target*(a.low/total),m=target*(a.mid/total),hi=target*(a.high/total);
   line(ctx,x,c-l,c+l,bandColor('low',.98));
   line(ctx,x,c-l-m,c-l,bandColor('mid',.98));line(ctx,x,c+l,c+l+m,bandColor('mid',.98));
   line(ctx,x,c-l-m-hi,c-l-m,bandColor('high',.98));line(ctx,x,c+l+m,c+l+m+hi,bandColor('high',.98));
  }
 }
 line(ctx,0,c+.5,w,c+.5,'rgba(255,255,255,.15)');
}
function drawOverview(){const w=overview.clientWidth,h=overview.clientHeight;octx.clearRect(0,0,w,h);drawWave(octx,w,h,(x,w)=>x/w*DURATION)}
function drawDetail(){
 const w=detail.clientWidth,h=detail.clientHeight;dctx.clearRect(0,0,w,h);const playT=getTime(),leftT=playT-visible/2;
 drawWave(dctx,w,h,(x,w)=>leftT+x/w*visible);
 if(showGrid&&currentStep===2){ const reveal=Math.min(1,(performance.now()-gridAnimStart)/900);
  const first=Math.floor(leftT/beatDur)-1;
  for(let n=first;n<first+24;n++){ if(((n-first)/24)>reveal) continue;
   const t=n*beatDur;if(t<0||t>DURATION)continue;const x=(t-leftT)/visible*w;if(x<0||x>w)continue;
   const down=n%4===0;dctx.strokeStyle=down?'rgba(255,139,35,.96)':'rgba(215,215,215,.38)';dctx.lineWidth=down?2:1;dctx.beginPath();dctx.moveTo(x,0);dctx.lineTo(x,h);dctx.stroke();
   if(down){dctx.fillStyle='#ff8b23';dctx.font='700 10px IBM Plex Mono';dctx.fillText(String(Math.floor(n/4)+1),x+5,16)}
  }
 }
 const pct=Math.max(0,Math.min(1,getTime()/DURATION));overviewCursor.style.left=`${pct*100}%`;
 const zw=visible/DURATION*100,zl=Math.max(0,Math.min(100-zw,pct*100-zw/2));zoomWindow.style.width=`${zw}%`;zoomWindow.style.left=`${zl}%`;
}
function draw(){drawOverview();drawDetail()}
function getTime(){return playing?Math.min(DURATION,(performance.now()-startAt)/1000):pausedAt}
function tick(){const t=getTime();timeReadout.textContent=`00:${t.toFixed(1).padStart(4,'0')} / 00:16.0`;drawDetail();if(t>=DURATION){stop(true);return}raf=requestAnimationFrame(tick)}
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function makeBuffer(which){
 const arr=bands[which],buf=audioCtx.createBuffer(1,Math.floor(DURATION*audioCtx.sampleRate),audioCtx.sampleRate),out=buf.getChannelData(0);
 for(let i=0;i<out.length;i++){const pos=i/audioCtx.sampleRate*MODEL_SR,j=Math.floor(pos),f=pos-j;out[i]=(arr[j]||0)*(1-f)+(arr[Math.min(N-1,j+1)]||0)*f}
 return buf;
}
function scheduleAudio(offset){
 initAudio();audioCtx.resume();source=audioCtx.createBufferSource();source.buffer=makeBuffer(activeBand==='all'?'all':activeBand);
 const gain=audioCtx.createGain();gain.gain.value=.46;

 /* ב־LOW בלבד מוסיפים סינון אמיתי וחזק כדי שהטרנזיינטים של הקיק
    לא ייצרו קליקים והרמוניות גבוהות שנשמעות מחוץ לתחום הנמוך. */
 if(activeBand==='low'){
  const lowPass1=audioCtx.createBiquadFilter();
  const lowPass2=audioCtx.createBiquadFilter();
  lowPass1.type='lowpass';lowPass1.frequency.value=170;lowPass1.Q.value=.7;
  lowPass2.type='lowpass';lowPass2.frequency.value=140;lowPass2.Q.value=.7;
  source.connect(lowPass1).connect(lowPass2).connect(gain).connect(audioCtx.destination);
 }else{
  source.connect(gain).connect(audioCtx.destination);
 }
 source.start(0,offset);source.onended=()=>{if(playing&&getTime()>=DURATION-.05)stop(true)};
}
function stop(reset=false){const t=getTime();playing=false;cancelAnimationFrame(raf);if(source){try{source.onended=null;source.stop()}catch(e){}source=null}pausedAt=reset?0:t;playBtn.textContent='▶';draw();timeReadout.textContent=`00:${pausedAt.toFixed(1).padStart(4,'0')} / 00:16.0`}
function play(){if(playing){stop(false);return}if(pausedAt>=DURATION)pausedAt=0;playing=true;startAt=performance.now()-pausedAt*1000;scheduleAudio(pausedAt);playBtn.textContent='Ⅱ';tick()}
playBtn.onclick=play;resetBtn.onclick=()=>stop(true);
function renderInfo(){
 if(currentStep===0)infoRow.innerHTML=`<div class="card insight"><h3>מה בדיוק מצויר כאן?</h3><p>זה אינו גל דקורטיבי. הצורה מחושבת מתוך <b>אותו קטע אודיו שאתם שומעים</b>. כל עמודה מציגה רגע אחר בזמן, וגובהה מייצג את עוצמת האודיו באותו רגע.</p><div class="callout"><div class="icon">↔</div><div><b>משמאל לימין</b><small>הזמן מתקדם בתוך הקטע.</small></div></div><div class="callout"><div class="icon">↕</div><div><b>גל גדול או קטן</b><small>מייצג רגע חזק או חלש יותר באודיו.</small></div></div></div><div class="card"><h3>האודיו והציור הם אותו מידע</h3><p>הקטע נוצר משלושה רכיבי אודיו. ה־Waveform שמופיע כאן מחושב מאותם רכיבים בדיוק, ולכן כל Kick, הפסקה ועלייה בעוצמה מופיעים במקום שבו הם נשמעים.</p></div>`;
 if(currentStep===1)infoRow.innerHTML=`<div class="card"><h3>פרקו את ה־Waveform לרכיבים</h3><div class="freq-grid"><button class="frequency-btn ${activeBand==='low'?'active':''}" data-band="low"><b>LOW · נמוכים</b><small>Kick ובאס</small></button><button class="frequency-btn ${activeBand==='mid'?'active':''}" data-band="mid"><b>MID · אמצעיים</b><small>מלודיה ורוב גוף הצליל</small></button><button class="frequency-btn ${activeBand==='high'?'active':''}" data-band="high"><b>HIGH · גבוהים</b><small>Hi-Hats ופרטים חדים</small></button></div><div class="controls"><button class="action-btn ${activeBand==='all'?'active':''}" data-band="all">שלושת התחומים יחד</button></div></div><div class="card insight"><h3>שלושה צבעים, Waveform אחד</h3><p>בתצוגה המשולבת כל צבע תופס את החלק שלו בתוך גובה הגל: <b style="color:var(--low)">אדום</b> לנמוכים, <b style="color:var(--mid)">ירוק</b> לאמצעיים ו־<b style="color:var(--high)">כחול</b> לגבוהים. לחיצה על תחום מבודדת רק את הרכיב שבאמת יוצר את אותו חלק בגל — וגם משמיעה אותו לבדו.</p><div class="legend"><span><i class="dot" style="background:var(--low)"></i>Low</span><span><i class="dot" style="background:var(--mid)"></i>Mid</span><span><i class="dot" style="background:var(--high)"></i>High</span></div></div>`;
 if(currentStep===2)infoRow.innerHTML=`<div class="card"><h3>הוסיפו את ה־Grid</h3><p>לחצו כדי להניח קווי זמן מוזיקליים מעל אותו Waveform. הגל והאודיו נשארים בדיוק כפי שהם.</p><div class="controls"><button class="action-btn ${showGrid?'active':''}" id="gridBtn">${showGrid?'הסתר Grid':'הצג Grid'}</button></div></div><div class="card insight"><h3>שתי שכבות שונות שמתחברות</h3><p><b>Waveform</b> מחושב מתוך האודיו ומציג מה נשמע בכל רגע.<br><b>Grid</b> אינו חלק מהאודיו — הוא מסמן איפה הביטים והתיבות יושבים ביחס אליו.</p><div class="callout"><div class="icon">│</div><div><b>קו אפור</b><small>Beat — פעימה אחת.</small></div></div><div class="callout"><div class="icon" style="color:var(--down)">1</div><div><b>קו כתום</b><small>הביט הראשון בתיבה.</small></div></div></div>`;
 document.querySelectorAll('[data-band]').forEach(btn=>{if(btn.classList.contains('step'))return;btn.onclick=()=>{const wasPlaying=playing,old=getTime();stop(false);pausedAt=old;activeBand=btn.dataset.band;renderInfo();draw();if(wasPlaying)play()}});
 const gb=document.getElementById('gridBtn');if(gb)gb.onclick=()=>{showGrid=!showGrid;if(showGrid)gridAnimStart=performance.now();renderInfo();draw()};
}
function setStep(i){currentStep=Math.max(0,Math.min(2,i));stop(true);activeBand='all';showGrid=false;const s=stages[currentStep];stageKicker.textContent=s.k;stageTitle.textContent=s.t;stageBadge.textContent=s.b;stageCopy.textContent=s.c;steps.forEach((x,n)=>x.classList.toggle('active',n===currentStep));prevBtn.disabled=currentStep===0;nextBtn.textContent=currentStep===2?'סיום':'הבא';stageCounter.textContent=`STEP 0${currentStep+1} / 03`;const p=Math.round((currentStep+1)/3*100);progressText.textContent=p+'%';progressBar.style.width=p+'%';renderInfo();draw()}
steps.forEach((s,i)=>s.onclick=()=>setStep(i));prevBtn.onclick=()=>setStep(currentStep-1);nextBtn.onclick=()=>{if(currentStep<2)setStep(currentStep+1);else{showGrid=true;renderInfo();draw();stageBadge.textContent='WAVEFORM + GRID'}};
setStep(0);resize();
</script>
</body>
</html>
